<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nebbos — one substrate.</title>
  <style>
    /* Nebbos substrate v3 · paper ground, no chrome, no controls.
       Values match app/globals.css tokens verbatim (this document is
       standalone — served from public/hero/, no @layer/@import resolution
       from the app). Any change to a token in tokens.css should be
       mirrored here. */
    :root {
      --color-paper: #FFFFFF;
      --color-paper-2: #F7F5F1;
      --color-ink: #1D1C22;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: none;
      user-select: none;
      background: var(--color-paper);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body translate="no">
  <canvas id="c"></canvas>
  <script>
    const C = document.getElementById('c'), X = C.getContext('2d');
    let W, H;

    // Nebbos wordmark — 7 filled paths, viewBox 354×67. Verbatim from
    // public/nebbos-wordmark-dark.svg. Fill: var(--color-ink) hex.
    const NEBBOS_PATHS = [
      'M101.062 36.0655H68.8002V57.8771H104.265L103.043 66.0607H59.3145V0.93924H102.589V9.12291H68.8002V27.8906H101.062V36.0742V36.0655Z',
      'M115.766 0.93924H141.5C155.689 0.93924 162.034 8.36629 162.034 17.2805C162.034 24.8119 157.758 29.6995 152.853 31.4562C157.382 32.9434 164.128 37.5353 164.128 46.9104C164.128 58.9729 154.852 66.0607 142.172 66.0607H115.757V0.93924H115.766ZM139.851 27.7514C148.795 27.7514 152.312 24.1683 152.312 18.1502C152.312 12.5755 148.263 8.77504 141.011 8.77504H125.277V27.7514H139.842H139.851ZM125.286 58.2249H140.785C148.883 58.2249 154.162 54.5114 154.162 46.8148C154.162 40.0921 149.825 35.6046 139.423 35.6046H125.286V58.2249Z',
      'M177.104 0.93924H202.839C217.028 0.93924 223.372 8.36629 223.372 17.2805C223.372 24.8119 219.096 29.6995 214.192 31.4562C218.721 32.9434 225.467 37.5353 225.467 46.9104C225.467 58.9729 216.191 66.0607 203.511 66.0607H177.096V0.93924H177.104ZM201.19 27.7514C210.134 27.7514 213.651 24.1683 213.651 18.1502C213.651 12.5755 209.602 8.77504 202.35 8.77504H186.616V27.7514H201.181H201.19ZM186.625 58.2249H202.123C210.222 58.2249 215.501 54.5114 215.501 46.8148C215.501 40.0921 211.164 35.6046 200.762 35.6046H186.625V58.2249Z',
      'M296.038 33.1608C296.038 51.111 285.802 67 265.094 67C245.616 67 234.883 52.1807 234.883 33.5C234.883 14.8193 246.009 0 265.879 0C284.415 0 296.038 13.6887 296.038 33.1608ZM244.997 33.2217C244.997 47.0409 251.917 58.8598 265.504 58.8598C280.182 58.8598 285.924 46.7713 285.924 33.2913C285.924 19.8113 279.414 8.13149 265.478 8.13149C251.542 8.13149 244.997 19.5417 244.997 33.213V33.2217Z',
      'M314.329 47.754C316.048 55.3202 321.284 59.286 330.394 59.286C340.09 59.286 343.973 54.8593 343.973 48.9716C343.973 42.6751 340.762 39.2747 328.03 36.2221C312.182 32.4129 307.016 26.9339 307.016 17.8458C307.016 7.85319 314.434 0.00869751 329.19 0.00869751C345.09 0.00869751 351.591 9.03596 352.481 17.7762H342.638C341.556 12.3233 338.187 7.64447 328.867 7.64447C321.328 7.64447 317.052 10.984 317.052 16.8978C317.052 22.8117 320.568 25.0119 331.852 27.7166C350.561 32.2303 354.017 39.4225 354.017 47.9367C354.017 58.7033 345.98 66.9217 329.749 66.9217C313.517 66.9217 305.89 58.1206 304.503 47.7801H314.346L314.329 47.7801Z',
      'M34.8101 42.9882L27.8812 37.0744C16.0655 26.9948 9.55554 14.1149 9.55554 0.808807H0V66.4434H9.55554V30.9258C12.828 35.7699 16.8858 40.3096 21.7116 44.4232L28.6404 50.337C33.7629 54.7115 36.5816 60.2252 36.5816 65.8868H46.1371C46.1371 57.3553 42.1142 49.2238 34.8101 42.9882Z',
      'M46.1288 0.808807H36.5732V20.9245H46.1288V0.808807Z'
    ];
    const WORDMARK_VB_W = 354;
    const WORDMARK_VB_H = 67;

    // Fixed physics parameters — the sliders were founder-flagged as
    // out-of-substrate. Values chosen for a lively but readable default.
    const PRESSURE = 0.62; // 0..1
    const GRAVITY = 0.42;  // 0..1
    const CURL = 0.48;     // 0..1
    const THICK = 0.44;    // 0..1
    const CHAOS = 0.24;    // 0..1

    // Strand palette — Nebbos accent + supporting hues. Drawn from
    // tokens.css OKLCH accents translated to sRGB for canvas.
    const COLS = ['#F6A03F', '#9A5D2A', '#4A4A52', '#6D4C2F', '#7B2F2A', '#1D1C22'];
    const COLS_L = ['#FDDA88', '#C9B896', '#8C8C94', '#B08E6E', '#C46F68', '#4A4952'];

    function makeSVG() {
      let paths = '';
      for (const d of NEBBOS_PATHS) paths += '<path d="' + d + '"/>';
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
        WORDMARK_VB_W + ' ' + WORDMARK_VB_H + '" fill="#1D1C22">' + paths + '</svg>';
    }

    let logoImg, collData, LS, LOX, LOY, LW, LH, ready = false;

    function loadImg(svg) {
      return new Promise(r => {
        const i = new Image();
        i.onload = () => r(i);
        i.src = 'data:image/svg+xml;base64,' + btoa(svg);
      });
    }

    async function buildLogo() {
      logoImg = await loadImg(makeSVG());
      const ci = await loadImg(makeSVG());
      LS = W * 0.55 / WORDMARK_VB_W;
      LW = WORDMARK_VB_W * LS;
      LH = WORDMARK_VB_H * LS;
      LOX = (W - LW) / 2;
      LOY = (H - LH) / 2;
      const cc = document.createElement('canvas');
      cc.width = W; cc.height = H;
      const cx = cc.getContext('2d');
      cx.drawImage(ci, LOX, LOY, LW, LH);
      collData = cx.getImageData(0, 0, W, H).data;
      ready = true;
    }

    const resize = () => {
      W = C.width = innerWidth;
      H = C.height = innerHeight;
      buildLogo();
    };
    resize();
    addEventListener('resize', resize);

    function hit(x, y) {
      if (!ready) return false;
      const ix = Math.round(x), iy = Math.round(y);
      if (ix < 0 || iy < 0 || ix >= W || iy >= H) return false;
      return collData[(iy * W + ix) * 4 + 3] > 30;
    }

    class Pt {
      constructor(x, y) { this.x = x; this.y = y; this.ox = x; this.oy = y; this.done = false; this.st = 0; }
      update() {
        if (this.done) return;
        const g = GRAVITY * 0.4;
        let vx = (this.x - this.ox) * 0.97, vy = (this.y - this.oy) * 0.97;
        this.ox = this.x; this.oy = this.y;
        this.x += vx; this.y += vy + g;
        if (hit(this.x, this.y)) {
          if (!hit(this.x, this.oy)) { this.y = this.oy; this.oy = this.y; }
          else if (!hit(this.ox, this.y)) { this.x = this.ox; this.ox = this.x; }
          else { this.x = this.ox; this.y = this.oy; }
          this.ox = this.x; this.oy = this.y; this.st += 4;
        }
        if (this.y > H - 1) { this.y = H - 1; this.oy = this.y; this.st += 4; }
        if (this.y < 0) { this.y = 0; this.oy = 0; this.st += 4; }
        if (this.x < 0) this.x = 0;
        if (this.x > W) this.x = W;
        if (this.st > 14) this.done = true;
      }
    }

    class Lk {
      constructor(a, b) { this.a = a; this.b = b; this.l = 2.5; this.broken = false; }
      solve() {
        if (this.broken) return;
        const dx = this.b.x - this.a.x, dy = this.b.y - this.a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || .001;
        if (d > 25) { this.broken = true; return; }
        const f = (this.l - d) / d * 0.25;
        if (!this.a.done) { this.a.x -= dx * f; this.a.y -= dy * f; }
        if (!this.b.done) { this.b.x += dx * f; this.b.y += dy * f; }
      }
    }

    let strands = [];
    let ci = 0;

    class Strand {
      constructor(i) { this.pts = []; this.lks = []; this.ci = i; }
      add(x, y, vx, vy) {
        const p = new Pt(x, y); p.ox = x - vx; p.oy = y - vy;
        if (this.pts.length) this.lks.push(new Lk(this.pts[this.pts.length - 1], p));
        this.pts.push(p);
      }
    }

    let mx = W / 2, my = H * 0.2, spraying = false, cur = null, spT = 0;
    let demo = true, demoT = 0;

    addEventListener('mousedown', () => {
      demo = false; spraying = true; spT = 0;
      cur = new Strand(ci++ % COLS.length); strands.push(cur);
    });
    addEventListener('mouseup', () => { spraying = false; cur = null; });
    addEventListener('mousemove', e => {
      if (demo) { demo = false; spraying = false; cur = null; }
      mx = e.clientX; my = e.clientY;
    });
    addEventListener('touchstart', e => {
      e.preventDefault(); demo = false;
      mx = e.touches[0].clientX; my = e.touches[0].clientY;
      spraying = true; spT = 0;
      cur = new Strand(ci++ % COLS.length); strands.push(cur);
    }, { passive: false });
    addEventListener('touchmove', e => {
      e.preventDefault();
      mx = e.touches[0].clientX; my = e.touches[0].clientY;
    }, { passive: false });
    addEventListener('touchend', () => { spraying = false; cur = null; });

    const CW = 18, CH = 46, NX = 10, NY = -CH / 2 - 3;

    function aimAngle(cx, cy) {
      const rawA = Math.atan2(LOY + LH / 2 - cy, LOX + LW / 2 - cx);
      return Math.atan2(Math.sin(rawA) * 0.15, Math.cos(rawA));
    }
    function tipWorld(cx, cy, rot) {
      return { x: cx + NX * Math.cos(rot) - NY * Math.sin(rot), y: cy + NX * Math.sin(rot) + NY * Math.cos(rot) };
    }

    function rr(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawCan(ctx, cx, cy) {
      const a = aimAngle(cx, cy);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
      ctx.save();
      ctx.shadowColor = 'rgba(20,18,15,0.10)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      const bg = ctx.createLinearGradient(-CW / 2, 0, CW / 2, 0);
      bg.addColorStop(0, '#1D1C22');
      bg.addColorStop(0.13, '#2A2830');
      bg.addColorStop(0.5, '#3D3B45');
      bg.addColorStop(0.87, '#2A2830');
      bg.addColorStop(1, '#141319');
      ctx.fillStyle = bg;
      rr(ctx, -CW / 2, -CH / 2, CW, CH, 4); ctx.fill();
      ctx.restore();
      const m = ctx.createLinearGradient(-CW / 2, 0, CW / 2, 0);
      m.addColorStop(0, '#8C8C94'); m.addColorStop(0.4, '#B8BAC3'); m.addColorStop(1, '#7C7C84');
      ctx.fillStyle = m;
      rr(ctx, -CW / 2 + 1, CH / 2 - 3, CW - 2, 3, 1); ctx.fill();
      rr(ctx, -CW / 2 + 1, -CH / 2, CW - 2, 3, 1); ctx.fill();
      ctx.fillStyle = 'rgba(246,160,63,0.12)';
      rr(ctx, -CW / 2 + 2, -5, CW - 4, 12, 2); ctx.fill();
      ctx.fillStyle = m;
      rr(ctx, -5, -CH / 2 - 4, 10, 5, 2); ctx.fill();
      ctx.fillStyle = cur ? COLS[cur.ci] : '#F6A03F';
      ctx.beginPath(); ctx.ellipse(0, -CH / 2 - 5, 4, 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#B8BAC3';
      ctx.beginPath();
      ctx.moveTo(2, -CH / 2 - 3);
      ctx.lineTo(NX - 1, NY - 1);
      ctx.lineTo(NX - 1, NY + 2);
      ctx.lineTo(2, -CH / 2 + 1);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7C7C84';
      ctx.beginPath(); ctx.arc(NX, NY, 2, 0, Math.PI * 2); ctx.fill();
      if (spraying && cur) {
        for (let i = 0; i < 3; i++) {
          const d = 1 + Math.random() * 5;
          ctx.fillStyle = COLS[cur.ci];
          ctx.globalAlpha = 0.08 + Math.random() * 0.1;
          ctx.beginPath();
          ctx.arc(NX + d, NY + (Math.random() - .5) * 3, .3 + Math.random() * .4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    function emitFrom(cx, cy) {
      if (!cur) return;
      spT++;
      const a = aimAngle(cx, cy);
      const tip = tipWorld(cx, cy, a);
      const pressure = 3 + PRESSURE * 11;
      const curlAmt = CURL * 4;
      const chaos = CHAOS * 1.2;
      for (let j = 0; j < 3; j++) {
        const speed = pressure + Math.random() * 2;
        const curl = Math.sin(spT * 0.35 + j * 1.7) * curlAmt;
        const wobble = (Math.random() - 0.5) * (0.15 + chaos);
        const pa = a + Math.PI / 2;
        cur.add(
          tip.x,
          tip.y,
          Math.cos(a + wobble) * speed + Math.cos(pa) * curl,
          Math.sin(a + wobble) * speed + Math.sin(pa) * curl
        );
      }
      let tot = 0;
      for (const s of strands) tot += s.pts.length;
      while (tot > 8000 && strands.length > 1) {
        const o = strands[0]; if (o === cur) break;
        if (o.pts.length) { o.pts.shift(); o.lks.shift(); tot--; }
        else strands.shift();
      }
    }

    function drawStrands(ctx) {
      const thick = 0.5 + THICK * 3.5;
      for (const s of strands) {
        if (s.pts.length < 2) continue;
        const pts = s.pts, lks = s.lks, col = COLS[s.ci], colL = COLS_L[s.ci];
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          if (i - 1 < lks.length && lks[i - 1].broken) { ctx.moveTo(pts[i].x, pts[i].y); continue; }
          const dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y;
          if (dx * dx + dy * dy > 600) { ctx.moveTo(pts[i].x, pts[i].y); continue; }
          ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, (pts[i - 1].x + pts[i].x) / 2, (pts[i - 1].y + pts[i].y) / 2);
        }
        ctx.save();
        ctx.shadowColor = col; ctx.shadowBlur = 2;
        ctx.strokeStyle = col; ctx.globalAlpha = 0.12; ctx.lineWidth = thick + 2; ctx.stroke();
        ctx.restore();
        ctx.strokeStyle = col; ctx.globalAlpha = 0.9; ctx.lineWidth = thick; ctx.stroke();
        ctx.strokeStyle = colL; ctx.globalAlpha = 0.2; ctx.lineWidth = thick * 0.3; ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function tick() {
      demoT++;
      let canX = mx, canY = my;
      if (demo) {
        canX = W * 0.1 + (Math.sin(demoT * 0.008) + 1) / 2 * W * 0.8;
        canY = H * 0.12 + Math.sin(demoT * 0.03) * 10;
        if (demoT % 2 === 0) {
          if (!cur || cur.pts.length > 150) { cur = new Strand(ci++ % COLS.length); strands.push(cur); }
          spraying = true;
        }
      }
      X.clearRect(0, 0, W, H);
      X.fillStyle = '#FFFFFF'; X.fillRect(0, 0, W, H);
      if (spraying) emitFrom(canX, canY);
      for (const s of strands) {
        for (const p of s.pts) p.update();
        for (let i = 0; i < 2; i++) for (const k of s.lks) k.solve();
      }
      drawStrands(X);
      if (logoImg) X.drawImage(logoImg, LOX, LOY, LW, LH);
      drawCan(X, canX, canY);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
