# Canonical Concept-Model drift check — consumer wire-up (INLINE variant).
#
# Wave B pilot: applies the canonical-noun-drift check shipped in Wave A on
# nebos-governance (docs/governance/conventions/canonical-concept-model.md +
# entity-models/people.yaml + scripts/check_canonical_noun_drift.py) against
# every PR in this repo.
#
# History: the initial attempt (2026-09-24) used the reusable-workflow pattern
# `uses: Nebos-ai/nebos-governance/.github/workflows/canonical-noun-drift.yml@main`.
# That failed to resolve at parse-time on this repo with a 0-second workflow-file
# issue on three consecutive runs (36012930970 / 36046548109 / 36054651875 /
# 36056703752), despite:
#   - the reusable file existing at that ref (verified via GitHub contents API)
#   - nebos-governance Actions access_level == "organization"
#   - the caller filename being disambiguated from the reusable target
#   - `secrets: inherit` removed to test parse-time secrets validation
# `referenced_workflows: []` on every attempt — GitHub was not resolving the
# cross-repo call, cause not surfaced in any log endpoint (annotations 404,
# logs 404). Time-boxed the debug and pivoted to this inline variant to unblock
# the pilot. Reusable pattern debug tracked separately as a follow-up.
#
# Posture (initial): NON-STRICT / warn-first. Marketing content in this repo
# has known drift (client=141× vs customer=49× per Wave A empirical scan on
# 2026-09-24); the drift is expected to fire on many existing paths until
# either terms are registered as views or copy is migrated. Flip strict=true
# after 30-day soak.
#
# Grounding: docs/governance/conventions/canonical-concept-model.md in
# nebos-governance (checked out below at runtime).

name: canonical-noun-drift

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch main for diff base
        run: git fetch origin main --depth=50

      - name: Run canonical-noun-drift check
        # Registry + script are mirrored under .nebos-governance-mirror/ in this
        # repo because nebos-governance is PRIVATE and the caller's github.token
        # 404s on cross-repo checkout (empirical: run 36057278241 2026-09-24).
        # Follow-up to migrate back to cross-repo pattern once a fine-grained
        # PAT `NEBOS_GOVERNANCE_READ_TOKEN` (contents:read on nebos-governance)
        # is set as a nebbos-site secret, OR nebos-governance goes public.
        #
        # NON-STRICT / warn-first — script exits 1 on drift by design;
        # continue-on-error: true keeps the overall job green so drift appears
        # as annotation, not a merge-blocker. Flip both continue-on-error and
        # --strict in the same PR after the 30-day soak.
        continue-on-error: true
        run: |
          python3 .nebos-governance-mirror/scripts/check_canonical_noun_drift.py \
            --registry-root .nebos-governance-mirror/entity-models \
            --diff-range origin/main..HEAD
