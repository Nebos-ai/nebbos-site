name: a11y

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-sweep:
    name: axe-core WCAG 2.2 AA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm install --no-audit --no-fund
      - name: install playwright browsers
        run: npx playwright install --with-deps chromium
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: staging
      - name: run a11y sweep
        # Advisory (2026-09-15) — attempted blocking flip in this same PR
        # surfaced a chicken-and-egg: --ink-3 needs different values on
        # light-bg vs dark-bg contexts to hit 4.5:1 in both directions
        # (post-darkening #6B6A73 clears light-bg #F7F5F1 at 5.4:1 but only
        # 3.16:1 on dark-bg #1D1C22). Single token can't satisfy both.
        # Follow-up (Axis C Wave 1d): bifurcate --ink-3 into --ink-3-on-paper
        # + --ink-3-on-ink OR add context-scoped overrides; verify axe zero
        # violations across all 18 test cases; then flip. Charter elite-bar
        # dim 6 pending Wave 1d.
        run: npm run test:a11y || true
      - name: upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
