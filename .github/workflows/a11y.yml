name: a11y

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-sweep:
    name: axe-core WCAG 2.2 AA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm install --no-audit --no-fund
      - name: install playwright browsers
        run: npx playwright install --with-deps chromium
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: staging
      - name: run a11y sweep
        # Advisory-retained (2026-09-15) — attempted blocking flip revealed 11
        # real WCAG 2.2 AA color-contrast violations (footer gold #a36630 @ 4.28:1
        # and gray #7c7b84 @ 3.83:1 on paper #f7f5f1; both need 4.5:1 for text
        # under 18pt). The `|| true` had been swallowing these all along — silent
        # advisory was worse than no gate. Fix follow-up (Axis C Wave 1c):
        # darken --gold + --ink-3 tokens in globals.css to hit 4.5:1, then flip
        # to blocking. Charter elite-bar dim 6 pending Wave 1c.
        run: npm run test:a11y || true
      - name: upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
