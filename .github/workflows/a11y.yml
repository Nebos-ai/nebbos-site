name: a11y

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-sweep:
    name: axe-core WCAG 2.2 AA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm install --no-audit --no-fund
      - name: install playwright browsers
        run: npx playwright install --with-deps chromium
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: staging
      - name: run a11y sweep
        # BLOCKING (2026-09-15 Wave 1e). Axis C Wave 1d shipped --ink-3-inverse
        # bifurcation in PR #55 (2026-09-15); axe has been consistently green
        # across every subsequent PR (#56, #57, #58). Both light-bg (--ink-3
        # #6B6A73 on --paper-2 #F7F5F1 = 5.4:1) and dark-bg (--ink-3-inverse
        # #B8BAC3 on --ink #1D1C22 = 5.5:1) hit WCAG 2.2 AA 4.5:1. Guard
        # removed; sweep now blocks merges on regression.
        # Charter elite-bar dim 6 (a11y CI-gated) satisfied.
        run: npm run test:a11y
      - name: upload html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
