name: lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# BLOCKING (2026-09-15, Axis C Wave 1): promoted from advisory after
# multiple green sweeps across the Wave 1 → Wave B6a arc. Charter elite-bar
# dim 5 (perf CI-gated) satisfied.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: lighthouse-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm install --no-audit --no-fund
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: staging
      - name: lighthouse ci
        # BLOCKING per header comment above (Axis C Wave 1 flip).
        run: npx lhci autorun --config=.lighthouserc.json
