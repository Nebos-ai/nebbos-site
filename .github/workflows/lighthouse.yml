name: lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# BLOCKING (2026-09-15 Wave 1e). Wave 1b (PR #51) fixed the URL-list
# 404s that were causing ERRORED_DOCUMENT_REQUEST silent failures under
# `|| true`. LHCI now hits 11 real routes (home + /products/* + /platform +
# security + trust + compliance + customers) and asserts against the
# .lighthouserc.json budget (perf >=0.85, a11y >=0.95, LCP <=2.5s,
# CLS <=0.1). Consistently green across #51-#58; guard removed.
# Charter elite-bar dim 5 (perf CI-gated) satisfied.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: lighthouse-ci
    runs-on: ubuntu-latest
    # 30 since the 2026-09 redesign: blur/glow layers paint in software on
    # the GPU-less runner (~70s per run vs ~12s locally), so 14 URLs x 2
    # runs no longer fit in 15 minutes. Budgets are unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm install --no-audit --no-fund
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: staging
      - name: lighthouse ci
        # BLOCKING per header comment above (Axis C Wave 1e flip).
        run: npx lhci autorun --config=.lighthouserc.json
