name: lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Advisory-only for now — the || true guard was hiding an ERRORED_DOCUMENT_REQUEST
# failure (LHCI hitting 404 at document-load, not measuring perf at all).
# Fix follow-up (Axis C Wave 1b): configure lighthouserc.json with
# startServerCommand or spin up npm run start in the workflow before lhci autorun.
# Then can promote to blocking. Charter elite-bar dim 5 pending until then.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: lighthouse-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm install --no-audit --no-fund
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: staging
      - name: lighthouse ci
        # Advisory per header comment above — || true retained until LHCI can
        # actually load the built pages (fix scheduled as Axis C Wave 1b).
        run: npx lhci autorun --config=.lighthouserc.json || true
